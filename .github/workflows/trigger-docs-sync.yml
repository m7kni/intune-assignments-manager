name: Trigger Documentation Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'zensical.toml'
  workflow_dispatch:

concurrency:
  group: docs-sync-${{ github.repository }}
  cancel-in-progress: true

jobs:
  trigger-sync:
    # ubuntu-latest, NOT self-hosted. This job ran on `self-hosted` with no
    # runner that would take it, so every run since it was written sat queued
    # for 24h and was auto-cancelled -- docs from this repo have never actually
    # published. The repo is public, so hosted runners cost nothing.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      # Mints a GitHub App installation token carrying contents:write on the docs
      # hub ONLY, replacing DOCS_SYNC_PAT. Nothing durable is stored here.
      #
      # This repo is in the m7kni ORG, so it has its own Tailscale federated
      # identity pinned to owner id 278668071 -- the rknightion one would refuse
      # its token. The OpenBao permission set is the SAME shared `docs-sync`
      # (every consumer dispatches at the same hub, which lives in rknightion,
      # so the App installation boundary is not crossed); only the role differs.
      - name: Mint a scoped docs-sync token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@1cd0af4cdb0f46266b34f3b981543e32e7c98b4a
        with:
          permission-set: docs-sync
          role: docs-sync-intune-assignments-manager
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - name: Trigger documentation sync in parent repo
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ steps.bao.outputs.token }}
          repository: rknightion/m7kni-net-site
          event-type: docs-update
          client-payload: '{"repository": "intune-assignments-manager"}'
